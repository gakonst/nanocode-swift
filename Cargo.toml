[package]
name = "nanocode-swift"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gakonst/nanocode-swift"
publish = false
autotests = false
autobenches = false

[lib]
name = "nanocode_swift"
crate-type = ["staticlib", "rlib"]
test = false
doctest = false
bench = false

[dependencies]
nanocode = { path = "../nanocodex/crates/nanocode", default-features = false, features = ["local-cells"] }
nanocode-code-mode = { path = "../nanocodex/crates/runtime/code-mode" }
nanocode-store-sqlite = { path = "../nanocodex/crates/integrations/store-sqlite" }
nanocode-sync = { path = "../nanocodex/crates/core/sync" }
nanocode-process-contracts = { path = "../nanocodex/crates/core/process" }
nanocode-tool-runtime = { path = "../nanocodex/crates/integrations/tool-runtime" }
nanocode-mcp-tools = { path = "../nanocodex/crates/integrations/mcp-tools" }
nanocode-http = { path = "../nanocodex/crates/core/http" }
mpp = { version = "0.17.1", default-features = false, features = ["client", "tempo", "sqlite", "reqwest-rustls-tls-no-provider"] }
async-trait = "0.1.89"
base64 = "0.22"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
http = "1.3.1"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rand = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
sha2 = "0.10"
tempo-alloy = { version = "1.11.0", default-features = false }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

[profile.dev]
debug = false
incremental = true

[profile.release]
opt-level = 3
lto = "off"
codegen-units = 16
panic = "unwind"
strip = "debuginfo"
