name: NanocodeDemo
options:
  bundleIdPrefix: xyz.nanocode
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Nanocode:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: C3Q4NN5ZQ8
    DEAD_CODE_STRIPPING: YES
targets:
  NanocodeDemo-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
    dependencies:
      - package: Nanocode
        product: NanocodeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.nanocode.demo
        PRODUCT_NAME: Nanocode
        PRODUCT_MODULE_NAME: NanocodeDemo
        INFOPLIST_KEY_CFBundleDisplayName: Nanocode
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: The agent can find, view and save your photos when you ask it to, and you can attach photos to a message.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: The agent can save images to your photo library when you ask it to.
        INFOPLIST_KEY_NSContactsUsageDescription: The agent can search, add and export your contacts when you ask it to.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: The agent can read your schedule and add events when you ask it to.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: The agent can read, add and complete your reminders when you ask it to.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: The agent can find where you are and search places nearby when you ask it to.
        INFOPLIST_KEY_NSLocationUsageDescription: The agent can find where you are and search places nearby when you ask it to.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: The agent can record and transcribe what you say when you ask it to listen.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Recordings become text, on this device when it can.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: The agent can list Bluetooth devices near you when you ask it to.
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: macOS/Nanocode.entitlements
  NanocodeDemo-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
    dependencies:
      - package: Nanocode
        product: NanocodeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.nanocode.demo
        PRODUCT_NAME: Nanocode
        PRODUCT_MODULE_NAME: NanocodeDemo
        INFOPLIST_KEY_CFBundleDisplayName: Nanocode
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: The agent can find, view and save your photos when you ask it to, and you can attach photos to a message.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: The agent can save images to your photo library when you ask it to.
        INFOPLIST_KEY_NSContactsUsageDescription: The agent can search, add and export your contacts when you ask it to.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: The agent can read your schedule and add events when you ask it to.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: The agent can read, add and complete your reminders when you ask it to.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: The agent can find where you are and search places nearby when you ask it to.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: The agent can record and transcribe what you say when you ask it to listen.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Recordings become text, on this device when it can.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: The agent can list Bluetooth devices near you when you ask it to.
        INFOPLIST_KEY_NSCameraUsageDescription: The agent can open the camera to take a photo or scan a document for you.
        INFOPLIST_KEY_NSMotionUsageDescription: The agent can read your step count and activity when you ask it to.
        INFOPLIST_KEY_NSAppleMusicUsageDescription: The agent can search and play music from your library when you ask it to.
        TARGETED_DEVICE_FAMILY: "1,2"
  NanocodeUIKit-iOS:
    type: application
    platform: iOS
    sources:
      - UIKit
    dependencies:
      - package: Nanocode
        product: NanocodeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.nanocode.demo.uikit
        PRODUCT_NAME: NanocodeUIKit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Attach photos to a message.
        TARGETED_DEVICE_FAMILY: "1,2"
  NanocodeAppKit-macOS:
    type: application
    platform: macOS
    sources:
      - AppKit
    dependencies:
      - package: Nanocode
        product: NanocodeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.nanocode.demo.appkit
        PRODUCT_NAME: NanocodeAppKit
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: macOS/Nanocode.entitlements
schemes:
  NanocodeUIKit-iOS:
    build:
      targets:
        NanocodeUIKit-iOS: all
  NanocodeAppKit-macOS:
    build:
      targets:
        NanocodeAppKit-macOS: all
  NanocodeDemo-macOS:
    build:
      targets:
        NanocodeDemo-macOS: all
    run:
      config: Debug
  NanocodeDemo-iOS:
    build:
      targets:
        NanocodeDemo-iOS: all
    run:
      config: Debug
